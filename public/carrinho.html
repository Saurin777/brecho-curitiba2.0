<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho - Brechó Curitiba</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header" id="cabecalho"></header>

  <main class="container">
    <h1 class="titulo-secao">Seu carrinho</h1>
    <p class="subtitulo-secao">Confira as peças escolhidas antes de fechar o pedido</p>

    <div id="listaCarrinho" class="lista-carrinho"></div>

    <div id="estadoVazio" class="estado-vazio" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <p>Seu carrinho está vazio. Que tal dar uma olhada nas peças em destaque?</p>
      <a href="/index.html" class="btn btn-primario">Ver peças</a>
    </div>

    <div id="resumoCarrinho" class="resumo-carrinho" style="display:none;">
      <div class="total">Total: <span id="totalCarrinho">R$ 0,00</span></div>
      <button id="btnFinalizar" class="btn btn-primario">Fechar pedido no WhatsApp</button>
    </div>
  </main>

  <div id="rodape"></div>

  <script src="/js/common.js"></script>
  <script src="/js/status.js"></script>
  <script src="/js/carrinho.js"></script>
</body>
</html>
