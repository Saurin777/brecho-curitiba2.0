<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - Brechó Curitiba</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="pagina-login">
  <main class="login-principal">
    <section class="marca-login" aria-label="Brechó Curitiba">
      <img id="logoLogin" src="/img/logo-padrao.svg" alt="Logo Brechó Curitiba">
      <p>Brechó Curitiba</p>
    </section>
    <div class="form-card">
      <h1>Entrar</h1>
      <div id="mensagemErro" class="mensagem-erro" style="display:none;"></div>
      <form id="formLogin">
        <div class="campo">
          <label for="contato">E-mail ou celular</label>
          <input type="text" id="contato" required inputmode="email" autocomplete="username" placeholder="nome@exemplo.com ou (41) 99999-9999">
        </div>
        <div class="campo">
          <label for="password">Senha</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>
      </form>
      <div class="form-rodape">
        Ainda não tem conta? <a href="/cadastro.html" style="color:var(--laranja-escuro); font-weight:600;">Cadastre-se</a>
      </div>
    </div>
  </main>

  <div id="rodape"></div>

  <script src="/js/common.js"></script>
  <script src="/js/status.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
