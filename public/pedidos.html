<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos/Vendas - Brechó Curitiba</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header" id="cabecalho"></header>

  <main class="container">
    <h1 class="titulo-secao">Pedidos/Vendas</h1>
    <p class="subtitulo-secao">Acompanhe os pedidos recebidos pelo WhatsApp e controle o estoque</p>

    <div id="areaPedidosPagina" style="display:none;">
      <div id="resumoPedidos" class="resumo-pedidos-grid"></div>
      <div class="abas-pedidos" role="tablist">
        <button type="button" class="aba-pedidos ativa" data-aba="pendentes">
          <span>Pendentes</span><span class="aba-badge">0</span>
        </button>
        <button type="button" class="aba-pedidos" data-aba="resolvidos">
          <span>Resolvidos</span><span class="aba-badge">0</span>
        </button>
      </div>
      <div id="areaPedidos"></div>
    </div>

    <div id="avisoAcesso" class="aviso-admin" style="display:none;">
      Esta área é restrita ao administrador da loja.
    </div>
  </main>

  <div id="rodape"></div>

  <script src="/js/common.js"></script>
  <script src="/js/status.js"></script>
  <script src="/js/pedidos.js"></script>
</body>
</html>
